<text x="55" y="500" font-family="DejaVu Sans,Arial,sans-serif" font-size="16px" font-weight="bold" fill="#1d4ed8">NOMINAL DIMENSIONS AND MANUFACTURING NOTES</text>
<text x="55" y="532" font-family="DejaVu Sans,Arial,sans-serif" font-size="16px" font-weight="bold" fill="#111827">Envelope: X=130.000 | Y=70.000 | Z=45.000</text>
<text x="55" y="560" font-family="DejaVu Sans,Arial,sans-serif" font-size="15px" font-weight="normal" fill="#334155">Family: u_channel | Single valid solid required | Position follows drawing datum</text>
<text x="55" y="595" font-family="DejaVu Sans,Arial,sans-serif" font-size="14px" font-weight="normal" fill="#334155">Outer 130 x 70 x 45 mm; base and both side walls are 8 mm thick. The channel void is x=0..130, y=8..62, z=8..45,</text>
<text x="55" y="619" font-family="DejaVu Sans,Arial,sans-serif" font-size="14px" font-weight="normal" fill="#334155">open at both X ends and at +Z.</text>
<text x="55" y="649" font-family="DejaVu Sans,Arial,sans-serif" font-size="15px" font-weight="bold" fill="#1d4ed8">Semantic checks:</text>
<text x="70" y="675" font-family="DejaVu Sans,Arial,sans-serif" font-size="14px" font-weight="normal" fill="#334155">• single U-shaped solid</text>
<text x="70" y="699" font-family="DejaVu Sans,Arial,sans-serif" font-size="14px" font-weight="normal" fill="#334155">• channel void has x=0..130, y=8..62, z=8..45 and is open at both X ends</text>
<text x="70" y="723" font-family="DejaVu Sans,Arial,sans-serif" font-size="14px" font-weight="normal" fill="#334155">• base and side-wall thickness is 8 mm</text>
<text x="945" y="532" font-family="DejaVu Sans,Arial,sans-serif" font-size="15px" font-weight="bold" fill="#1d4ed8">PROJECTION / DATUM</text>
<text x="945" y="560" font-family="DejaVu Sans,Arial,sans-serif" font-size="14px" font-weight="normal" fill="#334155">O=(0,0,0)</text>
<text x="945" y="584" font-family="DejaVu Sans,Arial,sans-serif" font-size="14px" font-weight="normal" fill="#334155">+Z is the stated thickness/axis direction</text>
<text x="945" y="608" font-family="DejaVu Sans,Arial,sans-serif" font-size="14px" font-weight="normal" fill="#334155">Redraw from the views and dimensions;</text>
<text x="945" y="632" font-family="DejaVu Sans,Arial,sans-serif" font-size="14px" font-weight="normal" fill="#334155">do not infer hidden geometry from the title.</text>
<text x="45" y="820" font-family="DejaVu Sans,Arial,sans-serif" font-size="13px" font-weight="normal" fill="#475569">Generated with FreeCAD TechDraw from the canonical solid; SVG/PDF/PNG are evidence renderings, STEP remains the output contract.</text>
