<text x="55" y="532" font-family="DejaVu Sans,Arial,sans-serif" font-size="16px" font-weight="bold" fill="#111827">Envelope: X=120.000 | Y=80.000 | Z=10.000</text>
<text x="55" y="560" font-family="DejaVu Sans,Arial,sans-serif" font-size="15px" font-weight="normal" fill="#334155">Family: plate | Single valid solid required | Position follows drawing datum</text>
<text x="55" y="595" font-family="DejaVu Sans,Arial,sans-serif" font-size="14px" font-weight="normal" fill="#334155">Envelope 120 x 80 x 10 mm; four diameter-12 Z-through holes. Centers: (20,20), (100,20), (20,60), (100,60).</text>
<text x="55" y="625" font-family="DejaVu Sans,Arial,sans-serif" font-size="15px" font-weight="bold" fill="#1d4ed8">Semantic checks:</text>
<text x="70" y="651" font-family="DejaVu Sans,Arial,sans-serif" font-size="14px" font-weight="normal" fill="#334155">• one connected plate solid</text>
<text x="70" y="675" font-family="DejaVu Sans,Arial,sans-serif" font-size="14px" font-weight="normal" fill="#334155">• four diameter-12 Z-through holes</text>
<text x="70" y="699" font-family="DejaVu Sans,Arial,sans-serif" font-size="14px" font-weight="normal" fill="#334155">• hole centers are the four listed XY coordinates</text>
<text x="945" y="532" font-family="DejaVu Sans,Arial,sans-serif" font-size="15px" font-weight="bold" fill="#1d4ed8">PROJECTION / DATUM</text>
<text x="945" y="560" font-family="DejaVu Sans,Arial,sans-serif" font-size="14px" font-weight="normal" fill="#334155">O=(0,0,0)</text>
<text x="945" y="584" font-family="DejaVu Sans,Arial,sans-serif" font-size="14px" font-weight="normal" fill="#334155">+Z is the stated thickness/axis direction</text>
<text x="945" y="608" font-family="DejaVu Sans,Arial,sans-serif" font-size="14px" font-weight="normal" fill="#334155">Redraw from the views and dimensions;</text>
<text x="945" y="632" font-family="DejaVu Sans,Arial,sans-serif" font-size="14px" font-weight="normal" fill="#334155">do not infer hidden geometry from the title.</text>
