<text x="55" y="500" font-family="DejaVu Sans,Arial,sans-serif" font-size="16px" font-weight="bold" fill="#1d4ed8">NOMINAL DIMENSIONS AND MANUFACTURING NOTES</text>
<text x="55" y="532" font-family="DejaVu Sans,Arial,sans-serif" font-size="16px" font-weight="bold" fill="#111827">Envelope: X=100.000 | Y=50.000 | Z=70.000</text>
<text x="55" y="560" font-family="DejaVu Sans,Arial,sans-serif" font-size="15px" font-weight="normal" fill="#334155">Family: angle_bracket | Single valid solid required | Position follows drawing datum</text>
<text x="55" y="595" font-family="DejaVu Sans,Arial,sans-serif" font-size="14px" font-weight="normal" fill="#334155">L bracket: horizontal leg x=0..100 at z=0..8, vertical leg x=0..8 at z=0..70, width y=0..50. Horizontal H1:</text>
<text x="55" y="619" font-family="DejaVu Sans,Arial,sans-serif" font-size="14px" font-weight="normal" fill="#334155">center (65,25,0), diameter 10, axis +Z. Vertical H1: center (0,25,45), diameter 10, axis +X. Interior x&gt;8,z&gt;8 is</text>
<text x="55" y="643" font-family="DejaVu Sans,Arial,sans-serif" font-size="14px" font-weight="normal" fill="#334155">open.</text>
<text x="55" y="673" font-family="DejaVu Sans,Arial,sans-serif" font-size="15px" font-weight="bold" fill="#1d4ed8">Semantic checks:</text>
<text x="70" y="699" font-family="DejaVu Sans,Arial,sans-serif" font-size="14px" font-weight="normal" fill="#334155">• two perpendicular legs fused into one solid</text>
<text x="70" y="723" font-family="DejaVu Sans,Arial,sans-serif" font-size="14px" font-weight="normal" fill="#334155">• horizontal H1 and vertical H1 are diameter-10 through holes</text>
<text x="70" y="747" font-family="DejaVu Sans,Arial,sans-serif" font-size="14px" font-weight="normal" fill="#334155">• inside corner x&gt;8,z&gt;8 remains open</text>
<text x="945" y="532" font-family="DejaVu Sans,Arial,sans-serif" font-size="15px" font-weight="bold" fill="#1d4ed8">PROJECTION / DATUM</text>
<text x="945" y="560" font-family="DejaVu Sans,Arial,sans-serif" font-size="14px" font-weight="normal" fill="#334155">O=(0,0,0)</text>
<text x="945" y="584" font-family="DejaVu Sans,Arial,sans-serif" font-size="14px" font-weight="normal" fill="#334155">+Z is the stated thickness/axis direction</text>
<text x="945" y="608" font-family="DejaVu Sans,Arial,sans-serif" font-size="14px" font-weight="normal" fill="#334155">Redraw from the views and dimensions;</text>
<text x="945" y="632" font-family="DejaVu Sans,Arial,sans-serif" font-size="14px" font-weight="normal" fill="#334155">do not infer hidden geometry from the title.</text>
