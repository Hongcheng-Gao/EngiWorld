<text x="55" y="787" font-family="DejaVu Sans,Arial,sans-serif" font-size="14px" fill="#334155">L bracket: horizontal leg x=0..100 at z=0..8, vertical leg x=0..8 at z=0..70, width y=0..50. Horizontal H1: center (65,25,0), diameter 10, axis +Z. Vertical H1: center (0,25,45), diameter 10, axis +X. Interior x&gt;8,z&gt;8 is open.</text>
<text x="55" y="812" font-family="DejaVu Sans,Arial,sans-serif" font-size="14px" fill="#334155"></text>
<text x="55" y="840" font-family="DejaVu Sans,Arial,sans-serif" font-size="15px" font-weight="normal" fill="#475569">Reconstruct a single valid STEP solid. Position may vary only when the drawing leaves it unconstrained.</text>
