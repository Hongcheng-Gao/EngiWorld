[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "engiworld"
version = "0.1.0"
description = "EngiWorld GUI/CLI agents, engineering environments, and artifact evaluation."
requires-python = ">=3.10"
dependencies = [
  "redis>=5.0.0",
  "volcengine-python-sdk[ark]",
  "boto3",
  "tenacity>=8.2.0",
]

[project.optional-dependencies]
worker-api = [
  "docker>=7,<8",
  "numpy~=1.26.0",
