[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agp-client"
version = "0.1.0"
description = "Client for AgP — create trajectories and poll for completion."
requires-python = "==3.12.*"
dependencies = [
  "aiohttp-retry>=2.8.0",
  "aiohttp>=3.9.0",
  "aiolimiter>=1.1.0",
  "pydantic>=2.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agp_client"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
